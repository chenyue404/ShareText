<!DOCTYPE html>
<html lang="__APP_LANG__">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ShareText</title>
    <style>
        :root {
            --bg: #eef2f7;
            --card: #ffffff;
            --text: #172033;
            --sub: #667187;
            --line: #dbe3ef;
            --brand: #1967d2;
            --ok: #1b8f4a;
            --bad: #c62828;
            --shadow: 0 10px 24px rgba(20, 40, 80, 0.08);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 0%, #f8fbff 0%, #eef2f7 45%),
                var(--bg);
        }

        #app {
            min-height: 100%;
            max-width: 880px;
            margin: 0 auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .header {
            padding: 14px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .sub {
            color: var(--sub);
            font-size: 13px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: #eef4ff;
            color: var(--brand);
        }

        .badge.error {
            background: #fde8e8;
            color: var(--bad);
        }

        .listWrap {
            flex: 1;
            min-height: 300px;
            max-height: 58vh;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item {
            background: #ffffff;
            border: 1px solid #e4eaf3;
            border-radius: 12px;
            padding: 10px 10px 10px 12px;
            animation: fadeIn 0.18s ease;
        }

        .itemRow {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .itemBody {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .itemText {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.45;
        }

        .itemMeta {
            margin-top: 6px;
            font-size: 12px;
            color: var(--sub);
        }

        .itemActions {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            align-self: flex-end;
            flex-shrink: 0;
        }

        .miniBtn {
            border: 1px solid #cdd8e8;
            background: #fff;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .miniBtn:hover {
            border-color: #9fb6db;
        }

        .empty {
            text-align: center;
            color: var(--sub);
            padding: 24px 10px;
        }

        .undoBar {
            display: none;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #cdd8e8;
            background: #f4f8ff;
            color: var(--sub);
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .undoBar.show {
            display: flex;
        }

        .composer {
            padding: 12px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        #input {
            flex: 1;
            min-height: 44px;
            max-height: 160px;
            resize: vertical;
            border: 1px solid #cdd8e8;
            border-radius: 10px;
            padding: 10px;
            font: inherit;
        }

        #input:focus {
            outline: none;
            border-color: #7aa7ef;
            box-shadow: 0 0 0 3px rgba(25, 103, 210, 0.12);
        }

        #send {
            width: 88px;
            height: 44px;
            border: 0;
            border-radius: 10px;
            background: var(--brand);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        #send:disabled {
            opacity: 0.55;
            cursor: default;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            #app { padding: 10px; }
            .listWrap { max-height: 52vh; }
            #send { width: 78px; }
        }
    </style>
</head>
<body>
<div id="app">
    <section class="panel header">
        <div>
            <div class="title" id="pageTitle">ShareText</div>
            <div class="sub" id="addr">--</div>
        </div>
        <div class="badge" id="netState">--</div>
    </section>

    <section class="panel listWrap" id="listWrap">
        <div class="empty" id="emptyHint">--</div>
    </section>

    <section class="undoBar" id="undoBar">
        <span id="undoText">--</span>
        <button class="miniBtn" id="undoBtn">--</button>
    </section>

    <section class="panel composer">
        <textarea id="input" placeholder=""></textarea>
        <button id="send">--</button>
    </section>
</div>

<script>
    const APP_LANG_RAW = "__APP_LANG__";
    const APP_LANG = APP_LANG_RAW.toLowerCase().startsWith("zh") ? "zh" : "en";
    const I18N = {
        zh: {
            pageTitle: "ShareText 局域网文本板",
            addressLabel: "地址",
            syncOk: "同步正常",
            syncError: "同步异常",
            syncErrorWithReason: "同步异常：{0}",
            connectFail: "连接失败",
            copyFail: "复制失败",
            sendFail: "发送失败",
            undoFail: "撤销失败",
            emptyHint: "还没有文本内容，发送后会显示在这里。",
            undoDeleted: "已删除",
            undoDeletedWithText: "已删除：{0}",
            undoAction: "撤销",
            inputPlaceholder: "输入文本，Ctrl+Enter 快速发送",
            send: "发送",
            copy: "复制",
            delete: "删除"
        },
        en: {
            pageTitle: "ShareText LAN Text Board",
            addressLabel: "Address",
            syncOk: "Sync OK",
            syncError: "Sync Error",
            syncErrorWithReason: "Sync Error: {0}",
            connectFail: "Connection failed",
            copyFail: "Copy failed",
            sendFail: "Send failed",
            undoFail: "Undo failed",
            emptyHint: "No text yet. It will appear here after sending.",
            undoDeleted: "Deleted",
            undoDeletedWithText: "Deleted: {0}",
            undoAction: "Undo",
            inputPlaceholder: "Enter text, Ctrl+Enter to send",
            send: "Send",
            copy: "Copy",
            delete: "Delete"
        }
    };

    function t(key) {
        return (I18N[APP_LANG] && I18N[APP_LANG][key]) || I18N.en[key] || key;
    }

    function tf(key, ...args) {
        let text = t(key);
        args.forEach((arg, idx) => {
            text = text.replace(`{${idx}}`, String(arg));
        });
        return text;
    }

    const baseUrl = window.location.origin;
    const listWrap = document.getElementById("listWrap");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const addrEl = document.getElementById("addr");
    const pageTitleEl = document.getElementById("pageTitle");
    const emptyHintEl = document.getElementById("emptyHint");
    const netStateEl = document.getElementById("netState");
    const undoBarEl = document.getElementById("undoBar");
    const undoTextEl = document.getElementById("undoText");
    const undoBtn = document.getElementById("undoBtn");

    let last = [];
    let loopTimer = null;
    let undoTimer = null;
    let isFetchingList = false;

    document.documentElement.lang = APP_LANG === "zh" ? "zh-CN" : "en";
    document.title = t("pageTitle");
    pageTitleEl.textContent = t("pageTitle");
    addrEl.textContent = `${t("addressLabel")}: ${baseUrl}`;
    emptyHintEl.textContent = t("emptyHint");
    undoTextEl.textContent = t("undoDeleted");
    undoBtn.textContent = t("undoAction");
    inputEl.placeholder = t("inputPlaceholder");
    sendBtn.textContent = t("send");

    function setNetState(ok, reason = "") {
        if (ok) {
            netStateEl.textContent = t("syncOk");
            netStateEl.className = "badge";
        } else {
            netStateEl.textContent = reason ? tf("syncErrorWithReason", reason) : t("syncError");
            netStateEl.className = "badge error";
        }
    }

    function render(data) {
        const safe = (Array.isArray(data) ? data : [])
            .map(normalizeItem)
            .filter(Boolean);

        if (JSON.stringify(safe) === JSON.stringify(last)) return;
        last = safe;
        listWrap.innerHTML = "";

        if (safe.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = t("emptyHint");
            listWrap.appendChild(empty);
            return;
        }

        safe.forEach((item) => {
            const card = document.createElement("div");
            card.className = "item";
            const row = document.createElement("div");
            row.className = "itemRow";

            const body = document.createElement("div");
            body.className = "itemBody";

            const text = document.createElement("div");
            text.className = "itemText";
            text.innerText = item.text;

            const actions = document.createElement("div");
            actions.className = "itemActions";

            const copyBtn = document.createElement("button");
            copyBtn.className = "miniBtn";
            copyBtn.textContent = t("copy");
            copyBtn.addEventListener("click", async () => {
                await copyText(item.text);
            });

            const delBtn = document.createElement("button");
            delBtn.className = "miniBtn";
            delBtn.textContent = t("delete");
            delBtn.addEventListener("click", async () => {
                await removeById(item.id);
                showUndo(item.text);
                await fetchList({ reschedule: false });
            });

            actions.appendChild(copyBtn);
            actions.appendChild(delBtn);
            const meta = document.createElement("div");
            meta.className = "itemMeta";
            meta.textContent = formatTime(item.timeMillis);

            body.appendChild(text);
            body.appendChild(meta);
            row.appendChild(body);
            row.appendChild(actions);
            card.appendChild(row);

            listWrap.appendChild(card);
        });

        listWrap.scrollTop = listWrap.scrollHeight;
    }

    function normalizeItem(raw) {
        if (raw == null) return null;
        if (typeof raw === "string") {
            const text = raw.trim();
            if (!text) return null;
            if (text.toLowerCase() === "null" || text.toLowerCase() === "undefined") return null;
            return { id: null, text, timeMillis: Date.now() };
        }
        if (typeof raw === "object") {
            const text = (raw.text == null ? "" : String(raw.text).trim());
            if (!text) return null;
            if (text.toLowerCase() === "null" || text.toLowerCase() === "undefined") return null;
            const timeMillis = Number(raw.timeMillis) || Date.now();
            const id = Number.isFinite(Number(raw.id)) ? Number(raw.id) : null;
            return { id, text, timeMillis };
        }
        return null;
    }

    function formatTime(timeMillis) {
        const dt = new Date(timeMillis);
        const hh = String(dt.getHours()).padStart(2, "0");
        const mm = String(dt.getMinutes()).padStart(2, "0");
        const ss = String(dt.getSeconds()).padStart(2, "0");
        return `${hh}:${mm}:${ss}`;
    }

    function scheduleNextFetch() {
        if (loopTimer) clearTimeout(loopTimer);
        loopTimer = setTimeout(() => fetchList({ reschedule: true }), 1800);
    }

    async function fetchList({ reschedule = true } = {}) {
        if (isFetchingList) return;
        isFetchingList = true;
        try {
            const resp = await fetch(`${baseUrl}/list`, { cache: "no-store" });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            setNetState(true);
            render(data || []);
        } catch (err) {
            setNetState(false, t("connectFail"));
        } finally {
            isFetchingList = false;
            if (reschedule) {
                scheduleNextFetch();
            }
        }
    }

    async function addText(text) {
        const form = new URLSearchParams();
        form.append("text", text);
        const resp = await fetch(`${baseUrl}/addText`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
            body: form.toString()
        });
        if (!resp.ok) {
            throw new Error("send failed");
        }
    }

    async function removeById(id) {
        if (id == null) {
            throw new Error("missing id");
        }
        const form = new URLSearchParams();
        form.append("id", String(id));
        const resp = await fetch(`${baseUrl}/removeById`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
            body: form.toString()
        });
        if (!resp.ok) {
            throw new Error("remove failed");
        }
    }

    async function undoRemove() {
        const resp = await fetch(`${baseUrl}/undoRemove`, {
            method: "POST"
        });
        if (!resp.ok) {
            throw new Error("undo failed");
        }
    }

    async function copyText(text) {
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
            } else {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
            }
            setNetState(true);
        } catch (_) {
            setNetState(false, t("copyFail"));
        }
    }

    async function submitInput() {
        const text = inputEl.value.trim();
        if (!text) return;
        sendBtn.disabled = true;
        try {
            await addText(text);
            inputEl.value = "";
            await fetchList({ reschedule: false });
        } catch (_) {
            setNetState(false, t("sendFail"));
        } finally {
            sendBtn.disabled = false;
        }
    }

    sendBtn.addEventListener("click", submitInput);
    undoBtn.addEventListener("click", async () => {
        try {
            await undoRemove();
            hideUndo();
            await fetchList({ reschedule: false });
        } catch (_) {
            setNetState(false, t("undoFail"));
        }
    });

    inputEl.addEventListener("keydown", (e) => {
        if (e.ctrlKey && e.key === "Enter") {
            e.preventDefault();
            submitInput();
        }
    });

    window.addEventListener("beforeunload", () => {
        if (loopTimer) clearTimeout(loopTimer);
        if (undoTimer) clearTimeout(undoTimer);
    });

    function showUndo(text) {
        if (undoTimer) clearTimeout(undoTimer);
        undoTextEl.textContent = tf("undoDeletedWithText", String(text || "").slice(0, 24));
        undoBarEl.classList.add("show");
        undoTimer = setTimeout(hideUndo, 5000);
    }

    function hideUndo() {
        if (undoTimer) {
            clearTimeout(undoTimer);
            undoTimer = null;
        }
        undoBarEl.classList.remove("show");
    }

    fetchList({ reschedule: true });
</script>
</body>
</html>
