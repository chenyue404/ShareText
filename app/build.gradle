apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.yanzhenjie.andserver'
android {

    compileSdkVersion 34

    defaultConfig {
        applicationId "com.cy.shareText"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 6
        versionName '1.4.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    namespace 'com.cy.shareText'
    applicationVariants.configureEach {
        variant ->
            variant.outputs.configureEach {
                outputFileName = "ShareText_${variant.name}${variant.versionName}_${variant.versionCode}_${buildTime()}.apk"
            }
    }
}

static def buildTime() {
    def date = new Date()
    def formattedDate = date.format('yyyyMMddHHmmss')
    return formattedDate
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.android.material:material:1.11.0'

    implementation 'com.yanzhenjie.andserver:api:2.1.12'
    kapt 'com.yanzhenjie.andserver:processor:2.1.12'
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.blankj:utilcodex:1.28.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.king.zxing:zxing-lite:1.1.7-androidx'
    implementation 'com.github.chenyue404:AndroidLib:1.0.14'
}
